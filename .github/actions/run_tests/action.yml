name: "Run tests"
description: "Runs the tests"

inputs:
  filter-expr:
    description: "Nextest filter expression"
    required: false
    default: "all()"

runs:
  using: "composite"
  steps:
    - name: Install nextest
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # 2.84.0
      with:
        tool: nextest

    - name: Install Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: "18"

    - name: Limit target directory size
      shell: bash -euxo pipefail {0}
      run: script/clear-target-dir-if-larger-than 350 200

    - name: Run tests
      shell: bash -euxo pipefail {0}
      # The randomized multi-buffer stress test can exceed the default 60s timeout on a fully loaded runner.
      run: cargo nextest run --workspace --no-fail-fast --test-timeout 120s --failure-output immediate-final --filter-expr '${{ inputs.filter-expr }}'
