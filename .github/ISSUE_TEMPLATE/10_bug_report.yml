name: Report a bug
description: Report a problem with Rdg.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Search [existing Rdg issues](https://github.com/RDG-Labs/rdg/issues) first and add a :+1: reaction if you found the same problem.

        Feature request? Use the [feature request form](https://github.com/RDG-Labs/rdg/issues/new?template=20_feature_request.yml).

        Questions and ideas are welcome in [GitHub Discussions](https://github.com/RDG-Labs/rdg/discussions).
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Zed install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Zed
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Rdg version and system specs
      description: |
        Copy the version and system information shown by Rdg's command palette.
      placeholder: |
        Zed: v0.215.0 (Zed Nightly bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Rdg log file
      description: |
        Open the command palette in Rdg, then type `zed: open log` to see the last 1000 lines. Or type `zed: reveal log in file manager` to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Zed.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Rdg settings
      description: |
        Open the command palette in Rdg, then type “zed: open settings file” and copy/paste any relevant (e.g., LSP-specific) settings.

        ⚠️ **Please review your settings file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant keymap
      description: |
        Open the command palette in Rdg, then type “zed: open keymap file” and copy/paste the file’s contents.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: dropdown
    attributes:
      label: If you are using WSL on Windows, what flavor of Linux are you using?
      multiple: false
      options:
        - Arch Linux
        - Ubuntu
        - Fedora
        - Mint
        - Pop!_OS
        - NixOS
        - Other
