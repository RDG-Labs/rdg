name: Report a crash
description: Rdg is crashing, freezing, or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Rdg install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Zed
        2. Perform an action
        3. Zed crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Rdg version and system specs
      description: |
        Copy the version and system information shown by Rdg's command palette.
      placeholder: |
        Zed: v0.215.0 (Zed Nightly bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Rdg log file
      description: |
        Open the command palette in Rdg, then type `zed: open log` to see the last 1000 lines. Or type `zed: reveal log in file manager` to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Rdg.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
