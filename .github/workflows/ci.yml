name: ci

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install WASI SDK
        run: ./script/download-wasi-sdk

      - name: Run Clippy
        run: ./script/clippy

  tests:
    name: Workspace tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install WASI SDK
        run: ./script/download-wasi-sdk

      - name: Run tests
        uses: ./.github/actions/run_tests
        with:
          # The rdg binary's GPUI integration tests require an interactive app lifecycle;
          # release builds validate the binary on each version tag.
          filter-expr: "not package(rdg)"


  # Platform builds run in rdg_release.yml after the release tag is validated.
