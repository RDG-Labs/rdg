name: experimental-zig-build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Build Linux with Zig
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Configure Zig C toolchain
        shell: bash
        run: |
          set -euo pipefail
          zig version
          cat > "$RUNNER_TEMP/zig-cc" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=x86_64-unknown-linux-gnu" ]]; then
              argument="--target=x86_64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          exec "$(command -v zig)" cc "\${arguments[@]}"
          EOF
          # Zig 0.16 turns this path-only UBSan flag into instrumentation; AWS-LC then needs a runtime Rust does not link.
          cat > "$RUNNER_TEMP/zig-cxx" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=x86_64-unknown-linux-gnu" ]]; then
              argument="--target=x86_64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          exec "$(command -v zig)" c++ "\${arguments[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-cc" "$RUNNER_TEMP/zig-cxx"
          {
            echo "CC=$RUNNER_TEMP/zig-cc"
            echo "CXX=$RUNNER_TEMP/zig-cxx"
          } >> "$GITHUB_ENV"

      - name: Build Rdg
        run: cargo build --release --package rdg --target x86_64-unknown-linux-gnu
