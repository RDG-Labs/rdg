name: experimental-zig-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: Benchmark ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, zig]
    env:
      CARGO_TARGET_DIR: target-${{ matrix.compiler }}
      BENCHMARK_COMPILER: ${{ matrix.compiler }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install Zig
        if: matrix.compiler == 'zig'
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Configure C toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            {
              echo "CC=/usr/bin/clang"
              echo "CXX=/usr/bin/clang++"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          zig version
          cat > "$RUNNER_TEMP/zig-cc" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=x86_64-unknown-linux-gnu" ]]; then
              argument="--target=x86_64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" cc "\${arguments[@]}"
          EOF
          # Zig 0.16 turns this path-only UBSan flag into instrumentation; AWS-LC then needs a runtime Rust does not link.
          cat > "$RUNNER_TEMP/zig-cxx" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=x86_64-unknown-linux-gnu" ]]; then
              argument="--target=x86_64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" c++ "\${arguments[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-cc" "$RUNNER_TEMP/zig-cxx"
          {
            echo "CC=$RUNNER_TEMP/zig-cc"
            echo "CXX=$RUNNER_TEMP/zig-cxx"
          } >> "$GITHUB_ENV"

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Measure clean build
        id: clean-build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          /usr/bin/time -f 'clean_seconds=%e' -o "$RUNNER_TEMP/clean-time" \
            cargo build --locked --release --package rdg --target x86_64-unknown-linux-gnu
          clean_seconds=$(cut -d= -f2 "$RUNNER_TEMP/clean-time")
          echo "clean_seconds=$clean_seconds" >> "$GITHUB_OUTPUT"
          echo "Clean build: ${clean_seconds}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Measure warm build
        id: warm-build
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'warm_seconds=%e' -o "$RUNNER_TEMP/warm-time" \
            cargo build --locked --release --package rdg --target x86_64-unknown-linux-gnu
          warm_seconds=$(cut -d= -f2 "$RUNNER_TEMP/warm-time")
          echo "warm_seconds=$warm_seconds" >> "$GITHUB_OUTPUT"
          {
            echo "Warm build: ${warm_seconds}s"
            echo
            printf "Compiler: \`%s\`\n" "$BENCHMARK_COMPILER"
            printf "Target: \`%s\`\n" 'x86_64-unknown-linux-gnu'
          } >> "$GITHUB_STEP_SUMMARY"
