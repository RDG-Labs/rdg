name: verify-macos-arm

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_CHANNEL: dev
  ZED_RELEASE_CHANNEL: dev

jobs:
  build:
    name: Build macOS aarch64
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Configure LLVM linker
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions llvm >/dev/null 2>&1 || brew install llvm
          brew list --versions lld >/dev/null 2>&1 || brew install lld
          llvm_prefix="$(brew --prefix llvm)"
          lld_prefix="$(brew --prefix lld)"
          test -x "$llvm_prefix/bin/clang"
          test -x "$lld_prefix/bin/ld64.lld"
          # LLVM 15 cannot place thunks correctly when the binary has multiple __text sections.
          # Keep Apple clang first on PATH for bindgen; only Rust's target linker uses LLVM clang.
          # Match the existing macOS bundle config to reduce duplicate generic code.
          {
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$llvm_prefix/bin/clang"
            echo "RUSTC_BOOTSTRAP=1"
            echo "RUSTFLAGS=-Z share-generics=y -C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=$lld_prefix/bin/ld64.lld"
          } >> "$GITHUB_ENV"

      - name: Build Rdg
        run: cargo build --release --package rdg --target aarch64-apple-darwin
