name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate_tag:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1

      - name: Validate tag and determine channel
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if [[ "$version" == *-pre ]]; then
            version="${version%-pre}"
            channel=preview
          else
            channel=stable
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create GitHub release
    needs: validate_tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            exit 0
          elif [[ "$RELEASE_CHANNEL" == "preview" ]]; then
            gh release create "$tag" --repo "$repo" \
              --title "Rdg ${tag#v}" \
              --generate-notes \
              --prerelease
          else
            gh release create "$tag" --repo "$repo" \
              --title "Rdg ${tag#v}" \
              --generate-notes
          fi

  build_linux:
    name: Build Linux x86_64
    needs:
      - validate_tag
      - create_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-target: true

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install WASI SDK
        run: ./script/download-wasi-sdk

      - name: Build Rdg
        run: cargo build --release --package rdg

      - name: Package Rdg
        run: |
          set -euo pipefail
          mkdir -p dist/rdg
          cp target/release/rdg dist/rdg/rdg
          cp LICENSE-APACHE LICENSE-GPL dist/rdg/
          tar -C dist -czf rdg-linux-x86_64.tar.gz rdg

      - name: Upload Linux package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" rdg-linux-x86_64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  build_macos:
    name: Build macOS ${{ matrix.arch }}
    needs:
      - validate_tag
      - create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-target: true

      - name: Build Rdg
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            # Apple Silicon's new linker cannot place this large binary within its
            # +/-128 MB branch range; ld_classic handles the branch islands.
            export RUSTFLAGS="-C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-Wl,-ld_classic"
          fi
          cargo build --release --package rdg --target "${{ matrix.target }}"

      - name: Package, sign, and notarize Rdg
        run: |
          set -euo pipefail

          required_secrets=(
            MACOS_CERTIFICATE
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_NOTARIZATION_KEY
            APPLE_NOTARIZATION_KEY_ID
            APPLE_NOTARIZATION_ISSUER_ID
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub secret: $secret_name" >&2
              exit 1
            fi
          done

          app_dir="dist/Rdg.app"
          iconset_dir="$RUNNER_TEMP/Rdg.iconset"
          keychain_path="$RUNNER_TEMP/rdg-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/rdg-certificate.p12"
          notary_key_path="$RUNNER_TEMP/rdg-notary-key.p8"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources" "$iconset_dir"

          cp "target/${{ matrix.target }}/release/rdg" "$app_dir/Contents/MacOS/Rdg"
          chmod +x "$app_dir/Contents/MacOS/Rdg"

          case "$RELEASE_CHANNEL" in
            stable) icon_source="crates/rdg/resources/app-icon@2x.png" ;;
            preview) icon_source="crates/rdg/resources/app-icon-preview@2x.png" ;;
            *) echo "Unsupported macOS release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$icon_source" --out "$iconset_dir/icon_${size}x${size}.png" >/dev/null
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" "$icon_source" --out "$iconset_dir/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset_dir" -o "$app_dir/Contents/Resources/Rdg.icns"

          cat > "$app_dir/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Rdg</string>
              <key>CFBundleExecutable</key>
              <string>Rdg</string>
              <key>CFBundleIconFile</key>
              <string>Rdg</string>
              <key>CFBundleIdentifier</key>
              <string>dev.rdg.Rdg</string>
              <key>CFBundleName</key>
              <string>Rdg</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${RELEASE_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${RELEASE_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15.7</string>
          </dict>
          </plist>
          EOF

          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"

          codesign --force --timestamp --options runtime \
            --keychain "$keychain_path" \
            --entitlements crates/rdg/resources/zed.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$app_dir/Contents/MacOS/Rdg"
          codesign --force --timestamp --options runtime \
            --keychain "$keychain_path" \
            --entitlements crates/rdg/resources/zed.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"

          dmg_dir="$RUNNER_TEMP/Rdg-dmg"
          dmg_path="rdg-macos-${{ matrix.arch }}.dmg"
          mkdir -p "$dmg_dir"
          cp -R "$app_dir" "$dmg_dir/"
          ln -s /Applications "$dmg_dir/Applications"
          hdiutil create -volname Rdg -srcfolder "$dmg_dir" -ov -format UDZO "$dmg_path"

          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$notary_key_path"
          chmod 600 "$notary_key_path"
          xcrun notarytool submit "$dmg_path" --wait \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID"
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature "$app_dir"

          security delete-keychain "$keychain_path"

      - name: Upload macOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "rdg-macos-${{ matrix.arch }}.dmg" --repo "$GITHUB_REPOSITORY" --clobber

  build_windows:
    name: Build Windows x86_64
    needs:
      - validate_tag
      - create_release
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-target: true

      - name: Build Rdg
        run: cargo build --release --package rdg

      - name: Package Rdg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageDir = "dist\rdg"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target\release\rdg.exe" "$packageDir\rdg.exe"
          Copy-Item "LICENSE-APACHE" "$packageDir\LICENSE-APACHE"
          Copy-Item "LICENSE-GPL" "$packageDir\LICENSE-GPL"

          # These files are produced by rdg's build script and improve terminal support.
          foreach ($file in @("conpty.dll", "OpenConsole.exe")) {
              $source = "target\$file"
              if (Test-Path $source) {
                  Copy-Item $source "$packageDir\$file"
              }
          }

          Compress-Archive -Path "$packageDir\*" -DestinationPath "rdg-windows-x86_64.zip" -Force

      - name: Upload Windows package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" rdg-windows-x86_64.zip --repo "$GITHUB_REPOSITORY" --clobber
