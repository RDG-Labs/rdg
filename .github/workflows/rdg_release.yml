name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      channel:
        description: Release channel
        required: true
        type: choice
        default: rc
        options:
          - release
          - rc
          - alpha
          - beta
      platform:
        description: Platforms to build and publish
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - linux_aarch64
          - macos
          - windows
      existing_release_tag:
        description: >-
          Retry publishing an already-created release (e.g. v0.3.0 or
          v0.3.0-rc.1) without bumping the version. Use when one platform
          failed after others already published; pick the failed platform
          above. The tag must already exist.
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_tag:
    name: Calculate release version
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      version: ${{ steps.release.outputs.version }}
      app_version: ${{ steps.release.outputs.app_version }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      retry: ${{ steps.release.outputs.retry }}
      build_platform: ${{ steps.release.outputs.build_platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Validate or calculate release
        id: release
        shell: bash
        env:
          BUILD_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
          EXISTING_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_release_tag || '' }}
        run: |
          set -euo pipefail

          # Retry path: re-publish one platform to an already-created release
          # without bumping the version. Tag must exist and must be contained in
          # its release branch (so we never republish stale artifacts).
          if [[ -n "${EXISTING_RELEASE_TAG:-}" ]]; then
            echo "Retry mode: re-publishing ${EXISTING_RELEASE_TAG} (platform: ${BUILD_PLATFORM})"
            git fetch --tags --force
            if ! git rev-parse --verify --quiet "refs/tags/${EXISTING_RELEASE_TAG}" >/dev/null; then
              echo "Release tag ${EXISTING_RELEASE_TAG} does not exist. It must be created by a prior run." >&2
              exit 1
            fi
            if [[ "${BUILD_PLATFORM}" == "all" ]]; then
              echo "existing_release_tag requires a specific platform, not 'all'." >&2
              exit 1
            fi
            if [[ "${EXISTING_RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rc|alpha|beta)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}"
              app_version="${EXISTING_RELEASE_TAG#v}"
              channel=preview
            elif [[ "${EXISTING_RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}"
              app_version="$version"
              channel=stable
            else
              echo "Unsupported release tag for retry: ${EXISTING_RELEASE_TAG}" >&2
              exit 1
            fi
            release_branch="release/v${version}"
            git fetch --no-tags origin "refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${release_branch}" >/dev/null; then
              echo "release branch ${release_branch} does not exist." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "refs/tags/${EXISTING_RELEASE_TAG}" "refs/remotes/origin/${release_branch}"; then
              echo "Tag ${EXISTING_RELEASE_TAG} is not contained in ${release_branch}; refusing to republish stale artifacts." >&2
              exit 1
            fi
            {
              echo "version=$version"
              echo "app_version=$app_version"
              echo "channel=$channel"
              echo "tag=${EXISTING_RELEASE_TAG}"
              echo "retry=true"
              echo "build_platform=${BUILD_PLATFORM}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "rdg") | .version')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}"
              app_version="$version"
              channel=stable
            elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(rc|alpha|beta)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}"
              app_version="${tag#v}"
              channel=preview
            else
              echo "Unsupported release tag: $tag. Use vX.Y.Z or vX.Y.Z-{rc,alpha,beta}.N." >&2
              exit 1
            fi

            if [[ "$package_version" != "$version" ]]; then
              echo "Tag version $version does not match Rdg version $package_version." >&2
              exit 1
            fi

            release_branch="release/v$version"
            git fetch --no-tags origin "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$release_branch"; then
              echo "Tag $tag must point to a commit contained in $release_branch." >&2
              exit 1
            fi
          else
            git fetch --tags --force
            base_version="$package_version"
            latest_stable_version="$(git tag -l 'v*' | sed -nE 's/^v([0-9]+\\.[0-9]+\\.[0-9]+)$/\\1/p' | sort -V | tail -1)"
            if [[ -n "$latest_stable_version" ]] && [[ "$(printf '%s\\n' "$base_version" "$latest_stable_version" | sort -V | tail -1)" == "$latest_stable_version" ]]; then
              base_version="$latest_stable_version"
            fi
            IFS=. read -r major minor patch <<< "$base_version"
            case "${{ inputs.bump }}" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "Unsupported version bump: ${{ inputs.bump }}" >&2; exit 1 ;;
            esac
            version="$major.$minor.$patch"
            selected_channel="${{ inputs.channel }}"
            case "$selected_channel" in
              release)
                tag="v$version"
                if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                  echo "Tag $tag already exists; choose a different version bump." >&2
                  exit 1
                fi
                app_version="$version"
                channel=stable
                ;;
              rc|alpha|beta)
                next_number=1
                while git rev-parse --verify --quiet "refs/tags/v$version-$selected_channel.$next_number" >/dev/null; do
                  next_number=$((next_number + 1))
                done
                tag="v$version-$selected_channel.$next_number"
                app_version="${tag#v}"
                channel=preview
                ;;
              *) echo "Unsupported release channel: $selected_channel" >&2; exit 1 ;;
            esac
          fi

          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "retry=${RETRY_FLAG:-false}"
            echo "build_platform=${BUILD_PLATFORM}"
          } >> "$GITHUB_OUTPUT"

  prepare_release:
    name: Bump version on main
    needs: validate_tag
    if: needs.validate_tag.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Bump version and push main
        id: commit
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${{ needs.validate_tag.outputs.retry }}" == "true" ]]; then
              # Retry: build from the existing release branch head (contains the
              # fix). Do not bump the version again.
              git fetch --no-tags origin "refs/heads/release/v$RELEASE_VERSION:refs/remotes/origin/release/v$RELEASE_VERSION"
              git checkout "refs/remotes/origin/release/v$RELEASE_VERSION"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ./script/bump-rdg-version "$RELEASE_VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/rdg/Cargo.toml Cargo.lock
            git commit -m "Bump RDG version to $RELEASE_VERSION"
            git push origin HEAD:main
            git push origin "HEAD:refs/heads/release/v$RELEASE_VERSION"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build_linux:
    name: Build Linux x86_64
    needs:
      - validate_tag
      - prepare_release
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && (needs.validate_tag.outputs.build_platform == 'all' || needs.validate_tag.outputs.build_platform == 'linux')
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_APP_VERSION: ${{ needs.validate_tag.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare_release.outputs.commit }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install WASI SDK
        run: ./script/download-wasi-sdk

      - name: Build Rdg
        run: cargo build --release --package rdg

      - name: Package Rdg
        run: |
          set -euo pipefail
          mkdir -p dist/rdg
          cp target/release/rdg dist/rdg/rdg
          cp LICENSE-APACHE LICENSE-GPL dist/rdg/
          case "$RELEASE_CHANNEL" in
            stable) icon_source="crates/rdg/resources/app-icon.png" ;;
            preview) icon_source="crates/rdg/resources/app-icon-preview.png" ;;
            *) echo "Unsupported release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          cp "$icon_source" dist/rdg/app-icon.png
          tar -C dist -czf rdg-linux-x86_64.tar.gz rdg

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-linux-x86_64
          path: rdg-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_linux_aarch64:
    name: Build Linux aarch64
    needs:
      - validate_tag
      - prepare_release
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && (needs.validate_tag.outputs.build_platform == 'all' || needs.validate_tag.outputs.build_platform == 'linux_aarch64')
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_APP_VERSION: ${{ needs.validate_tag.outputs.app_version }}
      ZIG_VERSION: 0.16.0
      CARGO_TARGET_DIR: target-zig-aarch64
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare_release.outputs.commit }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install aarch64 sysroot and libraries
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E '/^deb / { /^deb \[/! s/^deb( +)/deb [arch=amd64]\1/; }' "$source"
            fi
          done
          sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libasound2-dev:arm64 \
            libfontconfig-dev:arm64 \
            libgit2-dev:arm64 \
            libglib2.0-dev:arm64 \
            libsqlite3-dev:arm64 \
            libssl-dev:arm64 \
            libva-dev:arm64 \
            libvulkan-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxkbcommon-x11-dev:arm64 \
            libzstd-dev:arm64

      - name: Install WASI SDK
        run: ./script/download-wasi-sdk

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Configure cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-gnu
          cat > "$RUNNER_TEMP/zig-aarch64-cc" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=aarch64-unknown-linux-gnu" ]]; then
              argument="--target=aarch64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" cc "\${arguments[@]}"
          EOF
          cat > "$RUNNER_TEMP/zig-aarch64-cxx" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=aarch64-unknown-linux-gnu" ]]; then
              argument="--target=aarch64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" c++ "\${arguments[@]}"
          EOF
          cat > "$RUNNER_TEMP/aarch64-linker" <<'EOF'
          #!/usr/bin/env bash
          arguments=()
          for argument in "$@"; do
            [[ "$argument" == "-fuse-ld=lld" ]] && continue
            arguments+=("$argument")
          done
          exec /usr/bin/aarch64-linux-gnu-gcc "${arguments[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-aarch64-cc" "$RUNNER_TEMP/zig-aarch64-cxx" "$RUNNER_TEMP/aarch64-linker"
          {
            echo "CC=/usr/bin/clang"
            echo "CXX=/usr/bin/clang++"
            echo "CC_aarch64_unknown_linux_gnu=$RUNNER_TEMP/zig-aarch64-cc"
            echo "CXX_aarch64_unknown_linux_gnu=$RUNNER_TEMP/zig-aarch64-cxx"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$RUNNER_TEMP/aarch64-linker"
          } >> "$GITHUB_ENV"

      - name: Build Rdg
        run: cargo build --release --package rdg --target aarch64-unknown-linux-gnu

      - name: Package Rdg
        run: |
          set -euo pipefail
          mkdir -p dist/rdg
          cp "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/rdg" dist/rdg/rdg
          cp LICENSE-APACHE LICENSE-GPL dist/rdg/
          case "$RELEASE_CHANNEL" in
            stable) icon_source="crates/rdg/resources/app-icon.png" ;;
            preview) icon_source="crates/rdg/resources/app-icon-preview.png" ;;
            *) echo "Unsupported release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          cp "$icon_source" dist/rdg/app-icon.png
          tar -C dist -czf rdg-linux-aarch64.tar.gz rdg

      - name: Upload Linux aarch64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-linux-aarch64
          path: rdg-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_macos:
    name: Build macOS ${{ matrix.arch }}
    needs:
      - validate_tag
      - prepare_release
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && (needs.validate_tag.outputs.build_platform == 'all' || needs.validate_tag.outputs.build_platform == 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: aarch64
            runner: blacksmith-12vcpu-macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_APP_VERSION: ${{ needs.validate_tag.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare_release.outputs.commit }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Setup sccache
        run: ./script/setup-sccache
        env:
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: Configure LLVM linker
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions llvm >/dev/null 2>&1 || brew install llvm
          brew list --versions lld >/dev/null 2>&1 || brew install lld
          llvm_prefix="$(brew --prefix llvm)"
          lld_prefix="$(brew --prefix lld)"
          test -x "$llvm_prefix/bin/clang"
          test -x "$lld_prefix/bin/ld64.lld"
          # LLVM 15 cannot place thunks correctly when the binary has multiple __text sections.
          # Keep Apple clang first on PATH for bindgen; only Rust's target linker uses LLVM clang.
          # Match the existing macOS bundle config to reduce duplicate generic code.
          {
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$llvm_prefix/bin/clang"
            echo "RUSTC_BOOTSTRAP=1"
            echo "RUSTFLAGS=-Z share-generics=y -C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=$lld_prefix/bin/ld64.lld"
          } >> "$GITHUB_ENV"

      - name: Build Rdg
        run: cargo build --release --package rdg --target "${{ matrix.target }}"

      - name: Package Rdg app
        run: |
          set -euo pipefail
          app_dir="dist/Rdg.app"
          iconset_dir="$RUNNER_TEMP/Rdg.iconset"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources" "$iconset_dir"

          cp "target/${{ matrix.target }}/release/rdg" "$app_dir/Contents/MacOS/Rdg"
          chmod +x "$app_dir/Contents/MacOS/Rdg"

          case "$RELEASE_CHANNEL" in
            stable) icon_source="crates/rdg/resources/app-icon@2x.png" ;;
            preview) icon_source="crates/rdg/resources/app-icon-preview@2x.png" ;;
            *) echo "Unsupported release channel: $RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$icon_source" --out "$iconset_dir/icon_${size}x${size}.png" >/dev/null
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" "$icon_source" --out "$iconset_dir/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset_dir" -o "$app_dir/Contents/Resources/Rdg.icns"

          cat > "$app_dir/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Rdg</string>
              <key>CFBundleExecutable</key>
              <string>Rdg</string>
              <key>CFBundleIconFile</key>
              <string>Rdg.icns</string>
              <key>CFBundleIdentifier</key>
              <string>dev.rdg.Rdg</string>
              <key>CFBundleName</key>
              <string>Rdg</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${RELEASE_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${RELEASE_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15.7</string>
          </dict>
          </plist>
          EOF

          tar -C dist -czf "rdg-macos-${{ matrix.arch }}-app.tar.gz" Rdg.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-macos-${{ matrix.arch }}
          path: rdg-macos-${{ matrix.arch }}-app.tar.gz
          if-no-files-found: error
          retention-days: 30

  build_windows:
    name: Build Windows x86_64
    needs:
      - validate_tag
      - prepare_release
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && (needs.validate_tag.outputs.build_platform == 'all' || needs.validate_tag.outputs.build_platform == 'windows')
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ needs.validate_tag.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      ZED_APP_VERSION: ${{ needs.validate_tag.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare_release.outputs.commit }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-targets: true

      - name: Setup sccache
        shell: pwsh
        run: ./script/setup-sccache.ps1
        env:
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          SCCACHE_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          SCCACHE_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

      - name: Build Rdg and update helper
        run: cargo build --release --package rdg --package auto_update_helper

      - name: Package Rdg (portable zip and Inno installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "stage\rdg"
          New-Item -ItemType Directory -Path "$stage\tools" -Force | Out-Null

          Copy-Item "target\release\rdg.exe" "$stage\rdg.exe"
          Copy-Item "target\release\auto_update_helper.exe" "$stage\tools\auto_update_helper.exe"
          Copy-Item "LICENSE-APACHE" "$stage\LICENSE-APACHE"
          Copy-Item "LICENSE-GPL" "$stage\LICENSE-GPL"

          foreach ($file in @("conpty.dll", "OpenConsole.exe")) {
              $source = "target\$file"
              if (Test-Path $source) {
                  Copy-Item $source "$stage\$file"
              }
          }

          $iconName = if ($env:RELEASE_CHANNEL -eq "stable") { "app-icon.ico" } else { "app-icon-preview.ico" }
          Copy-Item "crates\rdg\resources\windows\$iconName" "$stage\Rdg.ico"
          Copy-Item "crates\rdg\resources\windows\$iconName" "$stage\app-icon.ico"

          # Portable zip.
          Compress-Archive -Path "$stage\*" -DestinationPath "rdg-windows-x86_64.zip" -Force

          # Inno Setup installer (silent-updatable).
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $appId = if ($env:RELEASE_CHANNEL -eq "stable") { "{{E6A1B2C3-4D5E-4F6A-9B8C-7D6E5F4A3B2C}}" } else { "{{F7B2C3D4-5E6F-4A7B-9C8D-8E7F6A5B4C3D}}" }
          $appName = if ($env:RELEASE_CHANNEL -eq "stable") { "Rdg" } else { "Rdg Preview" }
          $mutex = if ($env:RELEASE_CHANNEL -eq "stable") { "Rdg-Editor-Stable-Instance-Mutex" } else { "Rdg-Editor-Preview-Instance-Mutex" }
          $appUserId = if ($env:RELEASE_CHANNEL -eq "stable") { "RdgIndustries.Rdg" } else { "RdgIndustries.Rdg.Preview" }

          & $iscc "crates\rdg\resources\windows\rdg-install.iss" `
            "/dAppId=$appId" "/dAppName=$appName" "/dAppDisplayName=$appName" `
            "/dAppSetupName=rdg-windows-x86_64" "/dAppMutex=$mutex" `
            "/dAppUserId=$appUserId" "/dVersion=$env:RELEASE_VERSION" `
            "/dOutputDir=$env:GITHUB_WORKSPACE" "/dResourcesDir=$stage" "/dSourceDir=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "rdg-windows-x86_64.exe")) { throw "Inno Setup did not produce rdg-windows-x86_64.exe" }

      - name: Upload Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("rdg-windows-x86_64.zip", "rdg-windows-x86_64.exe")) {
            if (-not (Test-Path $file)) { throw "Missing expected artifact $file" }
          }
      - name: Upload Windows zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-windows-x86_64
          path: rdg-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-windows-x86_64-installer
          path: rdg-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 30

  publish_linux:
    name: Publish Linux artifact
    needs:
      - validate_tag
      - prepare_release
      - build_linux
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && needs.build_linux.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.validate_tag.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      RELEASE_TARGET: ${{ needs.prepare_release.outputs.commit }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rdg-linux-x86_64
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          asset="release-assets/rdg-linux-x86_64.tar.gz"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$repo" "$asset" --clobber
          else
            release_options=(--title "Rdg ${tag#v}" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              release_options+=(--verify-tag)
            else
              release_options+=(--target "$RELEASE_TARGET")
            fi
            [[ "$RELEASE_CHANNEL" == "preview" ]] && release_options+=(--prerelease)
            gh release create "$tag" --repo "$repo" "$asset" "${release_options[@]}"
          fi

  publish_linux_aarch64:
