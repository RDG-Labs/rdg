      RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      RELEASE_TARGET: ${{ needs.prepare_release.outputs.commit }}
    steps:
      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rdg-linux-aarch64
          path: release-assets

      - name: Upload aarch64 asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          asset="release-assets/rdg-linux-aarch64.tar.gz"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$repo" "$asset" --clobber
          else
            release_options=(--title "Rdg ${tag#v}" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              release_options+=(--verify-tag)
            else
              release_options+=(--target "$RELEASE_TARGET")
            fi
            [[ "$RELEASE_CHANNEL" == "preview" ]] && release_options+=(--prerelease)
            gh release create "$tag" --repo "$repo" "$asset" "${release_options[@]}"
          fi

  publish_windows:
    name: Publish Windows artifact
    needs:
      - validate_tag
      - prepare_release
      - build_windows
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && needs.build_windows.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.validate_tag.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      RELEASE_TARGET: ${{ needs.prepare_release.outputs.commit }}
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rdg-windows-x86_64
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rdg-windows-x86_64-installer
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          assets=("release-assets/rdg-windows-x86_64.zip" "release-assets/rdg-windows-x86_64.exe")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "missing expected asset: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$repo" "${assets[@]}" --clobber
          else
            release_options=(--title "Rdg ${tag#v}" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              release_options+=(--verify-tag)
            else
              release_options+=(--target "$RELEASE_TARGET")
            fi
            [[ "$RELEASE_CHANNEL" == "preview" ]] && release_options+=(--prerelease)
            gh release create "$tag" --repo "$repo" "${assets[@]}" "${release_options[@]}"
          fi

  publish_macos:
    name: Publish macOS artifacts
    needs:
      - validate_tag
      - prepare_release
      - build_macos
    if: always() && needs.validate_tag.result == 'success' && needs.prepare_release.result == 'success' && needs.build_macos.result == 'success'
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.validate_tag.outputs.tag }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.validate_tag.outputs.channel == 'stable' && 'production' || 'release-candidate' }}
    env:
      RELEASE_TAG: ${{ needs.validate_tag.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate_tag.outputs.channel }}
      RELEASE_TARGET: ${{ needs.prepare_release.outputs.commit }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.prepare_release.outputs.commit }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rdg-macos-*
          path: artifacts

      - name: Build DMG and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sign=false
          if [[ -n "${MACOS_CERTIFICATE:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            sign=true
          else
            echo "No signing certificate configured; packaging an unsigned DMG." >&2
          fi

          mkdir -p release-assets macos-apps
          dmg_paths=()
          for arch in x86_64 aarch64; do
            app_root="macos-apps/$arch"
            mkdir -p "$app_root"
            tar -xzf "artifacts/rdg-macos-$arch/rdg-macos-$arch-app.tar.gz" -C "$app_root"
            app_dir="$app_root/Rdg.app"

            if [[ "$sign" == "true" ]]; then
              keychain_path="$RUNNER_TEMP/rdg-signing.keychain-db"
              certificate_path="$RUNNER_TEMP/rdg-certificate.p12"
              security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
              security default-keychain -s "$keychain_path"
              security list-keychains -d user -s "$keychain_path"
              security set-keychain-settings -lut 21600 "$keychain_path"
              security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
              printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
              security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"

              codesign --force --timestamp --options runtime --keychain "$keychain_path" \
                --entitlements crates/rdg/resources/zed.entitlements \
                --sign "$MACOS_SIGNING_IDENTITY" "$app_dir/Contents/MacOS/Rdg"
              codesign --force --timestamp --options runtime --keychain "$keychain_path" \
                --entitlements crates/rdg/resources/zed.entitlements \
                --sign "$MACOS_SIGNING_IDENTITY" "$app_dir"
              codesign --verify --deep --strict --verbose=2 "$app_dir"
            fi

            dmg_dir="$RUNNER_TEMP/Rdg-dmg-$arch"
            dmg_path="release-assets/rdg-macos-$arch.dmg"
            mkdir -p "$dmg_dir"
            cp -R "$app_dir" "$dmg_dir/"
            ln -s /Applications "$dmg_dir/Applications"
            hdiutil create -volname Rdg -srcfolder "$dmg_dir" -ov -format UDZO "$dmg_path"
            dmg_paths+=("$dmg_path")
          done

          if [[ "$sign" == "true" ]]; then
            if [[ -z "${APPLE_NOTARIZATION_KEY:-}" || -z "${APPLE_NOTARIZATION_KEY_ID:-}" || -z "${APPLE_NOTARIZATION_ISSUER_ID:-}" ]]; then
              echo "Signing configured but notarization credentials missing; skipping notarization." >&2
            else
              notary_key_path="$RUNNER_TEMP/rdg-notary-key.p8"
              printf '%s' "$APPLE_NOTARIZATION_KEY" > "$notary_key_path"
              chmod 600 "$notary_key_path"
              for dmg_path in "${dmg_paths[@]}"; do
                xcrun notarytool submit "$dmg_path" --wait --key "$notary_key_path" \
                  --key-id "$APPLE_NOTARIZATION_KEY_ID" --issuer "$APPLE_NOTARIZATION_ISSUER_ID"
                xcrun stapler staple "$dmg_path"
                xcrun stapler validate "$dmg_path"
              done
            fi
          fi

          (
            cd release-assets
            shasum -a 256 rdg-macos-x86_64.dmg rdg-macos-aarch64.dmg
          ) > release-assets/SHA256SUMS
          assets=(release-assets/*)
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$repo" "${assets[@]}" --clobber
          else
            release_options=(--title "Rdg ${tag#v}" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              release_options+=(--verify-tag)
            else
              release_options+=(--target "$RELEASE_TARGET")
            fi
            [[ "$RELEASE_CHANNEL" == "preview" ]] && release_options+=(--prerelease)
            gh release create "$tag" --repo "$repo" "${assets[@]}" "${release_options[@]}"
          fi
