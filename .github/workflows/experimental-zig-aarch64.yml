name: experimental-zig-aarch64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  ZIG_VERSION: 0.16.0
  CARGO_TARGET_DIR: target-zig-aarch64
  PKG_CONFIG_ALLOW_CROSS: "1"
  PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

jobs:
  build:
    name: Build Linux aarch64 with Zig
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Install aarch64 sysroot and libraries
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E '/^deb / { /^deb \[/! s/^deb( +)/deb [arch=amd64]\1/; }' "$source"
            fi
          done
          sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libasound2-dev:arm64 \
            libfontconfig-dev:arm64 \
            libgit2-dev:arm64 \
            libglib2.0-dev:arm64 \
            libsqlite3-dev:arm64 \
            libssl-dev:arm64 \
            libva-dev:arm64 \
            libvulkan-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxkbcommon-x11-dev:arm64 \
            libzstd-dev:arm64

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Configure cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-gnu
          zig version
          cat > "$RUNNER_TEMP/zig-aarch64-cc" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=aarch64-unknown-linux-gnu" ]]; then
              argument="--target=aarch64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" cc "\${arguments[@]}"
          EOF
          cat > "$RUNNER_TEMP/zig-aarch64-cxx" <<EOF
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            if [[ "\$argument" == "-fsanitize-undefined-strip-path-components=-1" ]]; then
              continue
            elif [[ "\$argument" == "--target=aarch64-unknown-linux-gnu" ]]; then
              argument="--target=aarch64-linux-gnu"
            fi
            arguments+=("\$argument")
          done
          arguments+=("-fno-sanitize=undefined")
          exec "$(command -v zig)" c++ "\${arguments[@]}"
          EOF
          cat > "$RUNNER_TEMP/aarch64-linker" <<'EOF'
          #!/usr/bin/env bash
          arguments=()
          for argument in "$@"; do
            [[ "$argument" == "-fuse-ld=lld" ]] && continue
            arguments+=("$argument")
          done
          exec /usr/bin/aarch64-linux-gnu-gcc "${arguments[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/zig-aarch64-cc" "$RUNNER_TEMP/zig-aarch64-cxx" "$RUNNER_TEMP/aarch64-linker"
          {
            echo "CC=/usr/bin/clang"
            echo "CXX=/usr/bin/clang++"
            echo "CC_aarch64_unknown_linux_gnu=$RUNNER_TEMP/zig-aarch64-cc"
            echo "CXX_aarch64_unknown_linux_gnu=$RUNNER_TEMP/zig-aarch64-cxx"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$RUNNER_TEMP/aarch64-linker"
          } >> "$GITHUB_ENV"

      - name: Build Rdg
        run: cargo build --locked --release --package rdg --target aarch64-unknown-linux-gnu

      - name: Validate architecture
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/rdg"
          machine=$(file "$binary" | grep -o 'ARM aarch64')
          test -n "$machine"
          echo "Architecture OK: $machine"
          readelf -h "$binary"

      - name: Smoke test under emulation
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-user-static
          binary="$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/rdg"
          command -v qemu-aarch64-static
          qemu-aarch64-static "$binary" --help >/dev/null 2>&1
          echo "Runs under ARM64 emulation"

      - name: Package aarch64 binary
        run: |
          set -euo pipefail
          mkdir -p dist/rdg
          cp "$CARGO_TARGET_DIR/aarch64-unknown-linux-gnu/release/rdg" dist/rdg/rdg
          cp LICENSE-APACHE LICENSE-GPL dist/rdg/
          cp crates/rdg/resources/app-icon.png dist/rdg/app-icon.png
          tar -C dist -czf rdg-linux-aarch64.tar.gz rdg

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rdg-linux-aarch64-zig
          path: rdg-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Runtime test Linux aarch64 (native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: build
    steps:
      - name: Download aarch64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rdg-linux-aarch64-zig
          path: dist

      - name: Install runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libfontconfig1 libsqlite3-0 libxcb1 \
            libxkbcommon-x11-0 libwayland-client0 libx11-xcb1

      - name: Extract and verify
        run: |
          set -euo pipefail
          tar -xzf dist/rdg-linux-aarch64.tar.gz -C .
          machine=$(file rdg/rdg | grep -o 'ARM aarch64')
          test -n "$machine"
          echo "Native ARM64 binary OK: $machine"

      - name: Native runtime smoke test
        run: |
          set -euo pipefail
          ./rdg/rdg --help >/dev/null 2>&1
          echo "Runs natively on ARM64"

